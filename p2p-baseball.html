<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b14">
<title>P2P BASEBALL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#070b14;color:#e8edf5;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
input{user-select:text;-webkit-user-select:text}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none}.on{display:flex!important}
#lobby{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(circle at 50% 0,#1d2f50,#070b14 70%);overflow:auto}
h1{margin:0;font-size:34px;font-weight:900;font-style:italic;letter-spacing:2px;background:linear-gradient(90deg,#ffd54a,#ff5a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.6;font-size:13px;margin-top:-8px}
.btn{min-height:52px;min-width:44px;border:0;border-radius:14px;padding:0 22px;font-size:17px;font-weight:800;color:#fff;background:#243044;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.97);filter:brightness(1.2)}
.pri{background:linear-gradient(135deg,#ff8a1f,#ff3d54)}.grn{background:linear-gradient(135deg,#1fb86b,#0e8c93)}.line{background:#06c755}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;background:#0f1a2ecc;border:1px solid #26364f;border-radius:18px;padding:16px}
input{height:52px;border-radius:12px;border:1px solid #33486a;background:#09111f;color:#fff;font-size:18px;padding:0 14px;text-align:center;width:100%}
#st{min-height:20px;font-size:14px;color:#ffd54a;text-align:center}
#rid2{font-size:26px;font-weight:900;letter-spacing:2px;text-align:center;color:#ffd54a;word-break:break-all;user-select:text;-webkit-user-select:text}
#game{display:none}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.board{display:flex;align-items:center;gap:8px;background:#0a1222ee;border:1px solid #2a3c5c;border-radius:12px;padding:6px 10px;justify-content:space-between}
.tm{display:flex;flex-direction:column;gap:2px;min-width:92px}
.tm div{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;padding:1px 6px;border-radius:6px;opacity:.55}
.tm div.bat{opacity:1;background:#ff7a1830;box-shadow:inset 3px 0 #ff8a1f}
.tm b{font-size:22px;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.mid{text-align:center;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center}
#bases rect{fill:#1d2b44;stroke:#4a638f;stroke-width:1}#bases rect.f{fill:#ffd54a;stroke:#fff}
.bso{font-size:11px;font-weight:800;display:flex;flex-direction:column;gap:1px}
.bso div{display:flex;align-items:center;gap:4px}.bso span{display:inline-flex;gap:3px}
.bso i{width:9px;height:9px;border-radius:50%;background:#1d2b44;display:inline-block}
.bso .B i.o{background:#37e08a}.bso .S i.o{background:#ffd54a}.bso .O i.o{background:#ff4d5e}
.sd{text-align:center;display:flex;flex-direction:column;gap:3px;min-width:70px}
#role{font-size:12px;font-weight:900;border-radius:20px;padding:3px 8px}
#role.b{background:#ff7a18}#role.p{background:#2a6cff}
#spd{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffd54a}
#ctl,#hint{position:fixed;left:0;right:0;bottom:0;height:122px;z-index:10;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:none;flex-direction:column;gap:8px;background:linear-gradient(#05080d00,#05080df0 35%)}
#hint{align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#cfe0ff}
#types{display:flex;gap:8px}
.tb{flex:1;min-height:48px;border:2px solid #33486a;border-radius:12px;background:#111c30;color:#cfe0ff;font-size:15px;font-weight:800}
.tb.sel{border-color:#ff8a1f;background:#3a2410;color:#fff}
#go{min-height:54px;font-size:20px}
#swing{position:fixed;left:0;right:0;top:0;bottom:0;z-index:5;display:none;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
#swing div{min-width:60%;min-height:64px;display:flex;align-items:center;justify-content:center;border-radius:32px;border:3px solid #ffd54a;color:#ffd54a;font-size:26px;font-weight:900;letter-spacing:4px;background:#ffd54a18;animation:pl .7s infinite alternate}
@keyframes pl{to{background:#ffd54a40;transform:scale(1.04)}}
#res{position:fixed;left:0;right:0;top:34%;z-index:12;text-align:center;pointer-events:none;display:none}
#res .g{font-size:clamp(40px,15vw,84px);font-weight:900;font-style:italic;letter-spacing:1px;text-shadow:0 4px 20px #000;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#res .t{font-size:clamp(20px,6vw,32px);font-weight:800;margin-top:4px;text-shadow:0 2px 10px #000}
.gold{color:#ffd54a}.cyan{color:#5ee6ff}.lime{color:#9cff7a}.red{color:#ff6b7a}.org{color:#ffa63d}.grn2{color:#37e08a}
.hr{background:linear-gradient(90deg,#ffd54a,#ff4d3c,#ff2fa0);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s cubic-bezier(.2,1.6,.4,1),shk .12s 6 .5s}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shk{50%{transform:translateX(6px) rotate(1deg)}}
#over{z-index:30;background:#050810ee;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
#over h2{font-size:48px;margin:0;font-style:italic;font-weight:900}
@media (orientation:landscape) and (max-height:560px){
#ctl,#hint{left:auto;top:70px;bottom:0;width:178px;height:auto;right:0;background:none;padding:6px 8px}
#types{flex-direction:column}#go{min-height:52px}.board{padding:3px 8px}.tm b{font-size:18px}
}
</style></head><body>
<div id="lobby" class="scr on">
 <h1>P2P BASEBALL</h1><div class="sub">リアルタイム1打席勝負・オンライン対戦</div>
 <div class="card" id="c1">
  <button class="btn pri" id="mk">ルームを作成</button>
  <div style="text-align:center;opacity:.5;font-size:12px">または</div>
  <input id="rid" placeholder="ルームIDを入力" autocomplete="off" autocapitalize="off">
  <button class="btn grn" id="jn">IDで参加</button>
 </div>
 <div class="card" id="c2" style="display:none">
  <div style="text-align:center;font-size:13px;opacity:.7">ルームID（友達に送ってください）</div>
  <div id="rid2"></div>
  <button class="btn" id="cp">📋 IDをコピー</button>
  <a class="btn line" id="ln" target="_blank" rel="noopener">LINEで送る</a>
  <div style="text-align:center;font-size:14px">相手の接続を待っています…</div>
 </div>
 <div id="st"></div>
</div>
<div id="game" class="scr">
 <canvas id="cv"></canvas>
 <div id="hud"><div class="board">
  <div class="tm"><div id="r0"><span></span><b id="s0">0</b></div><div id="r1"><span></span><b id="s1">0</b></div></div>
  <div class="mid"><div id="inn">1回表</div>
   <svg id="bases" viewBox="0 0 40 30" width="44" height="33"><rect id="b2" x="16" y="3" width="8" height="8" transform="rotate(45 20 7)"/><rect id="b1" x="27" y="14" width="8" height="8" transform="rotate(45 31 18)"/><rect id="b3" x="5" y="14" width="8" height="8" transform="rotate(45 9 18)"/></svg></div>
  <div class="bso"><div class="B">B<span id="dB"></span></div><div class="S">S<span id="dS"></span></div><div class="O">O<span id="dO"></span></div></div>
  <div class="sd"><div id="role">攻撃</div><div id="spd">--- km/h</div></div>
 </div></div>
 <div id="swing"><div>SWING!</div></div>
 <div id="res"></div>
 <div id="ctl"><div id="types"><button class="tb sel" data-t="0">ストレート</button><button class="tb" data-t="1">スライダー</button><button class="tb" data-t="2">フォーク</button></div><button class="btn pri" id="go">投球！</button></div>
 <div id="hint"></div>
</div>
<div id="over" class="scr"><h2 id="oh"></h2><div id="ot" style="font-size:20px;font-weight:700"></div><button class="btn pri" onclick="location.reload()">ロビーに戻る</button></div>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
const INN=3;
const TY=[{n:'ストレート',sp:[146,157],ox:0,oy:0,k0:.5},{n:'スライダー',sp:[124,136],ox:-2.2,oy:0,k0:.42},{n:'フォーク',sp:[129,141],ox:0,oy:1.9,k0:.58}];
let peer,conn,isHost=false,my=0,S=null,P=null,phase='lobby',selT=0,selC=12,fx=null,sw=null,pid=0,W,H,D,L={},parts=[],started=0;
const STD=Array.from({length:170},()=>({x:Math.random(),y:Math.random(),c:['#ff6b6b','#ffd54a','#5ee6ff','#e8edf5','#9cff7a'][Math.random()*5|0]}));
const init=()=>({inn:1,half:0,o:0,b:0,s:0,bs:[0,0,0],sc:[0,0],over:0,win:-1});
const send=m=>{try{conn&&conn.open&&conn.send(m)}catch(e){}};
const status=t=>$('#st').textContent=t;
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300)e.preventDefault();lt=n},{passive:false});
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
if(location.hash.length>1)$('#rid').value=decodeURIComponent(location.hash.slice(1));

/* ---------- Lobby / network ---------- */
$('#mk').onclick=()=>{status('接続準備中…');isHost=true;my=0;mk(0)};
function mk(n){
 const id='pbs-'+Math.random().toString(36).slice(2,8);
 peer=new Peer(id);
 peer.on('open',id=>{
  $('#c1').style.display='none';$('#c2').style.display='flex';$('#rid2').textContent=id;status('');
  const url=/^https?:/.test(location.href)?'\n'+location.href.split('#')[0]+'#'+id:'';
  $('#ln').href='https://line.me/R/msg/text/?'+encodeURIComponent('野球で対戦しよう！\nルームID: '+id+url);
  $('#cp').onclick=()=>copy(id);
 });
 peer.on('error',e=>{if(e.type==='unavailable-id'&&n<5)mk(n+1);else status('エラー: '+e.type)});
 peer.on('connection',c=>{
  if(conn)return;conn=c;
  const go=()=>{if(started)return;started=1;S=init();send({t:'start',S});showGame()};
  c.on('open',go);if(c.open)go();
  c.on('data',onData);c.on('close',lost);
 });
}
function copy(t){
 const ok=()=>{$('#cp').textContent='✅ コピーしました';setTimeout(()=>$('#cp').textContent='📋 IDをコピー',1800)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fb());else fb();
 function fb(){const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();i.setSelectionRange(0,99);try{document.execCommand('copy');ok()}catch(e){}i.remove()}
}
$('#jn').onclick=()=>{
 const id=$('#rid').value.trim();if(!id)return status('IDを入力してください');
 status('接続中…');isHost=false;my=1;
 peer=new Peer();
 peer.on('open',()=>{
  conn=peer.connect(id,{reliable:true});
  conn.on('data',onData);conn.on('close',lost);conn.on('error',()=>status('接続エラー'));
  setTimeout(()=>{if(phase==='lobby')status('接続できません。IDを確認してください')},10000);
 });
 peer.on('error',e=>status('エラー: '+e.type));
};
function lost(){if(S&&S.over)return;over('接続切断','相手との接続が切れました')}
function onData(m){
 if(m.t==='start'){S=m.S;showGame()}
 else if(m.t==='pitch'){if(isHost)doThrow(m.type,m.cell)}
 else if(m.t==='throw')startPitch(m);
 else if(m.t==='swing'){if(isHost)resolve(m.i)}
 else if(m.t==='res')showRes(m);
}

/* ---------- Game flow ---------- */
function showGame(){$('#lobby').classList.remove('on');$('#game').classList.add('on');lay();hudUpd();newBall();setTimeout(lay,300)}
function newBall(){phase='wait';fx=null;ui()}
function ui(){
 if(!S)return;const bat=S.half===my;
 $('#ctl').style.display=(!bat&&phase==='wait')?'flex':'none';
 const h=$('#hint');let t='';
 if(bat&&phase==='wait')t='投手が球を選んでいます…';
 if(!bat&&(phase==='sent'||phase==='pitch'))t='投球中…';
 h.style.display=t?'flex':'none';h.textContent=t;
 $('#swing').style.display=(bat&&phase==='pitch')?'flex':'none';
 const r=$('#role');r.textContent=bat?'⚾ 攻撃':'🧤 守備';r.className=bat?'b':'p';
}
function hudUpd(){
 $('#s0').textContent=S.sc[0];$('#s1').textContent=S.sc[1];
 $('#r0').firstChild.textContent=(my===0?'あなた':'相手')+'(先)';$('#r1').firstChild.textContent=(my===1?'あなた':'相手')+'(後)';
 $('#r0').className=S.half===0?'bat':'';$('#r1').className=S.half===1?'bat':'';
 $('#inn').textContent=S.inn+'回'+(S.half?'裏':'表');
 const d=(n,m)=>Array.from({length:m},(_,i)=>'<i class="'+(i<n?'o':'')+'"></i>').join('');
 $('#dB').innerHTML=d(S.b,3);$('#dS').innerHTML=d(S.s,2);$('#dO').innerHTML=d(S.o,2);
 for(let i=0;i<3;i++)$('#b'+(i+1)).setAttribute('class',S.bs[i]?'f':'');
 ui();
}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{selT=+b.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('sel',x===b))});
$('#go').onclick=()=>{
 if(phase!=='wait'||S.half===my)return;
 if(isHost)doThrow(selT,selC);else{phase='sent';ui();send({t:'pitch',type:selT,cell:selC})}
};
cv.addEventListener('pointerdown',e=>{
 if(phase!=='wait'||!S||S.half===my)return;
 const c=Math.floor((e.clientX-L.zx)/L.cs+2.5),r=Math.floor((e.clientY-L.zy)/L.cs+2.5);
 if(c>=0&&c<5&&r>=0&&r<5)selC=r*5+c;
});
function doThrow(type,cell){
 if(phase!=='wait'&&phase!=='sent')return;
 const t=TY[type],spd=t.sp[0]+Math.floor(Math.random()*(t.sp[1]-t.sp[0]+1));
 const m={t:'throw',type,cell,spd,dur:Math.round(900+(150-spd)*8),id:++pid};
 send(m);startPitch(m);
}
function startPitch(m){
 P={...m,t0:performance.now(),swung:0,res:0};sw=null;fx=null;phase='pitch';
 $('#spd').textContent=m.spd+' km/h';ui();
 const bat=S.half===my,id=m.id;
 if(bat)setTimeout(()=>{if(P&&P.id===id&&!P.swung&&!P.res){P.swung=1;inp({take:1,id})}},m.dur+280);
 if(isHost)setTimeout(()=>{if(P&&P.id===id&&!P.res)resolve({take:1,id})},m.dur+(bat?450:3000));
}
const inp=i=>isHost?resolve(i):send({t:'swing',i});
$('#swing').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(phase!=='pitch'||!P||P.swung)return;
 P.swung=1;const el=performance.now()-P.t0;sw={t0:performance.now()};
 inp({el,x:(e.clientX-L.zx)/L.cs,y:(e.clientY-L.zy)/L.cs,id:P.id});
});

/* ---------- Ball physics (cell units, zone centre = 0,0) ---------- */
const SC=u=>.55+.45*Math.min(u,1);
function bpos(u){
 u=Math.max(0,Math.min(u,1));const t=TY[P.type],ex=P.cell%5-2,ey=Math.floor(P.cell/5)-2,p=Math.pow(u,1.5);
 const k=u<=t.k0?0:Math.pow((u-t.k0)/(1-t.k0),2),y0=-7;
 return{x:(ex+t.ox)*p-t.ox*k,y:y0+(ey-t.oy-y0)*p+t.oy*k};
}
const zin=c=>{const r=Math.floor(c/5),q=c%5;return r>=1&&r<=3&&q>=1&&q<=3};

/* ---------- Host-side resolution ---------- */
function endHalf(){
 S.o=0;S.b=S.s=0;S.bs=[0,0,0];
 if(S.half===0){if(S.inn>=INN&&S.sc[1]>S.sc[0])fin();else S.half=1}
 else{if((S.inn>=INN&&S.sc[0]!==S.sc[1])||S.inn>=INN+3)fin();else{S.inn++;S.half=0}}
}
function fin(){S.over=1;S.win=S.sc[0]>S.sc[1]?0:S.sc[1]>S.sc[0]?1:-1}
function adv(n){
 let runs=0;const nb=[0,0,0];
 for(let i=2;i>=0;i--)if(S.bs[i]){let p=i+1+n;if(n===1&&i===1&&Math.random()<.5)p=4;if(p>=4)runs++;else nb[p-1]=1}
 if(n<4)nb[n-1]=1;else runs++;
 S.bs=nb;return runs;
}
function walk(){
 let runs=0;const[a,b,c]=S.bs;
 if(a){if(b){if(c)runs=1;S.bs=[1,1,1]}else S.bs=[1,1,c]}else S.bs=[1,b,c];
 return runs;
}
function resolve(i){
 if(!P||P.res||i.id!==P.id)return;P.res=1;
 const inZ=zin(P.cell);let kind,text,tier=-9,tx=0,lift=0,runs=0,chg=0,fl=null,dt=0;
 const nb=()=>{S.b=S.s=0};
 const addOut=()=>{S.o++;nb();if(S.o>=3){chg=1;endHalf()}};
 const strike=()=>{S.s++;if(S.s>=3){text='三振！';kind='so';addOut()}};
 if(i.take){
  if(inZ){kind='strike';text='見逃しストライク';strike()}
  else{kind='ball';text='ボール';S.b++;if(S.b>=4){text='四球';kind='bb';runs=walk();nb()}}
 }else{
  const u=i.el/P.dur,bp=bpos(u),sc=SC(u);dt=i.el-P.dur;const a=Math.abs(dt);
  tier=a<=45?3:a<=95?2:a<=150?1:a<=230?0:-1;
  const d=Math.hypot(i.x-bp.x*sc,i.y-bp.y*sc);
  if(d>1.4)tier-=2;else if(d>.85)tier-=1;
  if(!inZ)tier-=1;
  lift=Math.max(-1,Math.min(1,bp.y*sc-i.y));tx=Math.max(-2.5,Math.min(2.5,i.x));
  const dir=tx<-.7?'レフト':tx>.7?'ライト':'センター';
  if(tier<0){kind='miss';text='空振り';strike()}
  else if(tier===0){kind='foul';text='ファール';if(S.s<2)S.s++;fl={tx:dt<0?-1.3:1.3,ty:.5,arc:.9}}
  else{
   const hr=[0,.02,.12+.1*lift,.45+.15*lift][tier],rr=Math.random();let n;
   if(rr<hr)n=4;
   else if(tier===3)n=rr<hr+.3?2:rr<hr+.35?3:1;
   else if(tier===2)n=rr<hr+.2?2:rr<hr+.6?1:0;
   else n=rr<.3?1:rr<.34?2:0;
   const fx0=tx/2.5,fly=lift>.2;
   if(n===0){
    kind='out';text=dir+(fly?'フライ':'ゴロ')+'アウト';fl={tx:fx0,ty:fly?.6:.3,arc:fly?.9:0};
    if(!fly&&S.bs[0]&&S.o<2&&Math.random()<.4){text='ダブルプレー！';S.bs[0]=0;addOut();if(!chg)addOut()}else addOut();
   }else{
    kind=n===4?'hr':'hit';runs=adv(n);nb();
    text=n===4?'ホームラン！':n===3?'スリーベースヒット':n===2?'ツーベースヒット':dir+'ヒット';
    fl={tx:fx0,ty:[0,fly?.55:.42,.75,.9,1.15][n],arc:n===4?1.3:fly?.8:.15};
   }
  }
 }
 S.sc[S.half]+=runs;
 if(runs&&kind!=='hr')text+='　'+runs+'点';
 if(runs&&kind==='hr')text=(runs===1?'ソロ':runs+'ラン')+'ホームラン！';
 if(S.half===1&&S.inn>=INN&&S.sc[1]>S.sc[0]&&!S.over)fin();
 if(chg&&!S.over)text+=' / チェンジ';
 let g=i.take?(inZ?'STRIKE':'BALL'):tier>=3?'PERFECT':tier===2?'GREAT':tier===1?'GOOD':'MISS';
 if(kind==='so')g='STRIKE OUT';if(kind==='bb')g='WALK';if(kind==='hr')g='HOME RUN!!';
 const r={t:'res',id:P.id,sw:!i.take,kind,text,g,fl,S:JSON.parse(JSON.stringify(S))};
 send(r);showRes(r);
}

/* ---------- Result display ---------- */
function showRes(r){
 if(!P||P.rid===r.id)return;P.rid=r.id;phase='result';S=r.S;fx={t0:performance.now(),r};
 if(r.sw&&!sw)sw={t0:performance.now()};
 hudUpd();
 const cl={PERFECT:'gold',GREAT:'cyan',GOOD:'lime',MISS:'red',STRIKE:'org',BALL:'grn2','STRIKE OUT':'red',WALK:'grn2','HOME RUN!!':'hr'}[r.g]||'';
 const el=$('#res');el.innerHTML='<div class="g '+cl+'">'+r.g+'</div><div class="t">'+r.text+'</div>';
 el.style.display='block';
 if(r.kind==='hr')boom();
 if(navigator.vibrate)navigator.vibrate(r.kind==='hr'?[60,40,140]:r.fl?30:0);
 const id=r.id,wait=r.kind==='hr'?3000:r.fl?2100:1700;
 setTimeout(()=>{
  if(!P||P.rid!==id)return;el.style.display='none';
  if(S.over)finish();else newBall();
 },wait);
}
function boom(){
 setTimeout(()=>{
  for(let i=0;i<110;i++){const a=Math.random()*6.283,v=2+Math.random()*7;
   parts.push({x:L.zx,y:L.hh+(L.zy-L.hh)*.35,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:['#ffd54a','#ff4d3c','#ff2fa0','#5ee6ff','#fff'][i%5]})}
 },650);
 setTimeout(()=>{for(let i=0;i<70;i++){const a=Math.random()*6.283,v=2+Math.random()*6;parts.push({x:L.zx*(.4+Math.random()*1.2),y:L.hh+60+Math.random()*120,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,c:['#ffd54a','#fff','#ff8a1f'][i%3]})}},1300);
}
function finish(){
 const w=S.win;
 over(w===-1?'DRAW':w===my?'YOU WIN!':'YOU LOSE',S.sc[0]+' - '+S.sc[1]+'　('+(my===0?'あなた先攻':'あなた後攻')+')');
}
function over(h,t){$('#oh').textContent=h;$('#ot').textContent=t;$('#over').classList.add('on')}

/* ---------- Rendering ---------- */
function lay(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2.5);cv.width=W*D;cv.height=H*D;
 const land=W>H&&H<560,hh=$('#hud').offsetHeight,ch=land?0:122,aw=land?W-178:W,ah=H-hh-ch;
 const cs=Math.max(20,Math.min(aw*.115,ah/10,50));
 L={aw,hh,cs,zx:aw/2,zy:hh+ah*.56};
}
addEventListener('resize',()=>setTimeout(lay,50));addEventListener('orientationchange',()=>setTimeout(lay,250));
function draw(now){
 requestAnimationFrame(draw);
 if(!S||phase==='lobby'||!L.cs)return;
 const c=cx,{cs,zx,zy,hh,aw}=L;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);
 let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070b14');g.addColorStop(.4,'#0e1a2c');g.addColorStop(1,'#0a1a10');c.fillStyle=g;c.fillRect(0,0,W,H);
 const gy=zy-4.7*cs;
 STD.forEach(s=>{c.globalAlpha=.55;c.fillStyle=s.c;c.fillRect(s.x*W,hh+s.y*(gy-hh-6),2,2)});c.globalAlpha=1;
 c.fillStyle='#1c2b44';c.fillRect(0,gy-6,W,8);c.fillStyle='#ffd54a33';c.fillRect(0,gy-6,W,2);
 g=c.createLinearGradient(0,gy,0,H);g.addColorStop(0,'#15412a');g.addColorStop(1,'#0b2616');c.fillStyle=g;c.fillRect(0,gy+2,W,H-gy);
 c.fillStyle='#ffffff08';for(let i=0;i<10;i+=2)c.fillRect(i*W/10,gy+2,W/10,H-gy);
 c.fillStyle='#4a3524';c.beginPath();c.ellipse(zx,zy+3*cs,4.6*cs,2.4*cs,0,0,7);c.fill();
 c.strokeStyle='#ffffff66';c.lineWidth=2;c.strokeRect(zx-3.7*cs,zy+1.4*cs,2.1*cs,3.1*cs);c.strokeRect(zx+1.6*cs,zy+1.4*cs,2.1*cs,3.1*cs);
 c.fillStyle='#f2f5fa';c.beginPath();c.moveTo(zx-.7*cs,zy+3.2*cs);c.lineTo(zx+.7*cs,zy+3.2*cs);c.lineTo(zx+.7*cs,zy+3.55*cs);c.lineTo(zx,zy+3.95*cs);c.lineTo(zx-.7*cs,zy+3.55*cs);c.fill();
 // pitcher
 const py=zy-7*SC(0)*cs;
 c.fillStyle='#5a4230';c.beginPath();c.ellipse(zx,py+.5*cs,.7*cs,.22*cs,0,0,7);c.fill();
 c.fillStyle='#2a6cff';c.fillRect(zx-.17*cs,py-.5*cs,.34*cs,.7*cs);c.fillStyle='#e9c9a0';c.beginPath();c.arc(zx,py-.65*cs,.17*cs,0,7);c.fill();
 // catcher
 c.fillStyle='#2b3547';rr(c,zx-.8*cs,zy+2*cs,1.6*cs,1.3*cs,.4*cs);c.fill();c.fillStyle='#8b95a8';c.beginPath();c.arc(zx,zy+1.85*cs,.42*cs,0,7);c.fill();
 // ball geometry
 let bx=0,by=0,br=0,caught=0,showB=0;
 if(P){
  let u=(now-P.t0)/P.dur;
  if(phase==='pitch'){u=Math.max(0,u);showB=1}
  else if(phase==='result'&&fx&&!fx.r.fl){u=1;showB=1}
  if(showB){const q=bpos(u),s=SC(u),uu=Math.min(u,1);bx=zx+q.x*cs*s;by=zy+q.y*cs*s;br=cs*(.1+.22*Math.pow(uu,1.3));caught=u>=1}
 }
 const tg=P?[P.cell%5-2,Math.floor(P.cell/5)-2]:[0,0];
 const mx=caught?zx+tg[0]*cs:zx,my2=caught?zy+tg[1]*cs:zy+.2*cs;
 // zone / selection grid
 const sel=phase==='wait'&&S.half!==my;
 if(sel){for(let r=0;r<5;r++)for(let q=0;q<5;q++){const inn=r>=1&&r<=3&&q>=1&&q<=3,s=r*5+q===selC;
   c.fillStyle=s?'#ff8a1fb0':inn?'#37e08a22':'#ff4d5e18';c.fillRect(zx+(q-2.5)*cs,zy+(r-2.5)*cs,cs,cs);
   c.strokeStyle='#ffffff30';c.lineWidth=1;c.strokeRect(zx+(q-2.5)*cs,zy+(r-2.5)*cs,cs,cs)}}
 c.strokeStyle='#e6eefccc';c.lineWidth=2;c.strokeRect(zx-1.5*cs,zy-1.5*cs,3*cs,3*cs);
 c.strokeStyle='#e6eefc40';c.lineWidth=1;c.beginPath();for(let i=1;i<3;i++){c.moveTo(zx-1.5*cs+i*cs,zy-1.5*cs);c.lineTo(zx-1.5*cs+i*cs,zy+1.5*cs);c.moveTo(zx-1.5*cs,zy-1.5*cs+i*cs);c.lineTo(zx+1.5*cs,zy-1.5*cs+i*cs)}c.stroke();
 // mitt
 c.fillStyle='#b8793a';c.beginPath();c.arc(mx,my2,.5*cs,0,7);c.fill();c.strokeStyle='#6b3f17';c.lineWidth=2;c.stroke();
 // batter
 const fy=zy+3.5*cs,bX=zx-2.7*cs;
 c.fillStyle='#e8edf5';rr(c,bX-.45*cs,fy-1.8*cs,.35*cs,1.8*cs,.1*cs);c.fill();rr(c,bX+.1*cs,fy-1.8*cs,.35*cs,1.8*cs,.1*cs);c.fill();
 c.fillStyle='#ff7a18';rr(c,bX-.55*cs,fy-3.6*cs,1.1*cs,1.9*cs,.3*cs);c.fill();
 c.fillStyle='#e9c9a0';c.beginPath();c.arc(bX,fy-4*cs,.42*cs,0,7);c.fill();c.fillStyle='#ff3d54';c.beginPath();c.arc(bX,fy-4.1*cs,.44*cs,Math.PI,0);c.fill();
 let ang=-1.25;if(sw){const p=Math.min((now-sw.t0)/230,1);ang=-1.25+1.75*(1-Math.pow(1-p,3))}
 const hx=bX+.5*cs,hy=fy-3*cs;
 c.strokeStyle='#d9b27a';c.lineWidth=Math.max(4,cs*.14);c.lineCap='round';c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+Math.cos(ang)*2.8*cs,hy+Math.sin(ang)*2.8*cs);c.stroke();
 // pitch ball
 if(showB){
  if(phase==='pitch'&&!caught)for(let k=4;k>=1;k--){const q=bpos((now-P.t0)/P.dur-k*.035),s=SC((now-P.t0)/P.dur-k*.035);c.globalAlpha=.1*(5-k)/2;c.fillStyle='#fff';c.beginPath();c.arc(zx+q.x*cs*s,zy+q.y*cs*s,br*(1-k*.1),0,7);c.fill()}
  c.globalAlpha=1;ball(c,bx,by,br);
 }
 // hit flight
 if(fx&&fx.r.fl&&phase==='result'){
  const f=fx.r.fl,dur=fx.r.kind==='hr'?1600:1100,t=Math.min((now-fx.t0)/dur,1);
  if(t<1||fx.r.kind==='hr'){
   const hx0=zx,hy0=zy+3*cs,ex=zx+f.tx*aw*.42,ey=hy0-(hy0-hh)*f.ty;
   const x=hx0+(ex-hx0)*t,y=hy0+(ey-hy0)*t-Math.sin(Math.PI*t)*f.arc*cs*3,r=cs*.3*(1-t*.75);
   if(fx.r.kind==='hr'){c.globalAlpha=.35;c.fillStyle='#ffd54a';c.beginPath();c.arc(x,y,r*3,0,7);c.fill();c.globalAlpha=1}
   if(t<1)ball(c,x,y,Math.max(r,2));
  }
  if(fx.r.kind==='hr'){const a=Math.max(0,.45-(now-fx.t0)/900);if(a>0){c.fillStyle='rgba(255,210,90,'+a+')';c.fillRect(0,0,W,H)}}
 }
 // particles
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l-=.011;c.globalAlpha=Math.max(p.l,0);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,3,0,7);c.fill()}
 c.globalAlpha=1;parts=parts.filter(p=>p.l>0);
}
function ball(c,x,y,r){
 c.save();c.shadowColor='#fff';c.shadowBlur=r*1.2;c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore();
 c.strokeStyle='#e0364b';c.lineWidth=Math.max(1,r*.15);c.beginPath();c.arc(x-r*1.1,y,r*.85,-.8,.8);c.stroke();c.beginPath();c.arc(x+r*1.1,y,r*.85,Math.PI-.8,Math.PI+.8);c.stroke();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
requestAnimationFrame(draw);
</script>
